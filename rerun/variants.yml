# Manuscript runs of the analysis scripts: which hard-coded parameters to set (run_variant.py) so that the
# script writes the run directory named in "published" (relative to the results root; v6 names, run_variants.py
# substitutes the version). Executed by run_variants.py; each variant is one Slurm job.
# Groups: fast (seconds to minutes on the caches), organelle, stage2 (skeleton passes), stage3/stage4 (read other runs).
variants:
  # ---- Fig 2F-H, 3C-E, S8, Table S8: synapse sizes / multisynapses
  - name: synmulti_MSN
    group: fast
    script: dir_indir_pathway_analysis/syn_conn_details.py
    set: {conn_ct: "3", ct2: "6", ct3: "7"}
    published: dir_indir_pathway_analysis/241025_j0251v6_MSN_GPe_GPi_syn_multisyn_mcl_200_synprob_0.60_kde1_f20_stn_gt
  - name: synmulti_STN
    group: fast
    script: dir_indir_pathway_analysis/syn_conn_details.py
    set: {conn_ct: "4", ct2: "6", ct3: "7"}
    published: dir_indir_pathway_analysis/241025_j0251v6_STN_GPe_GPi_syn_multisyn_mcl_200_synprob_0.60_kde1_f20_stn_gt
  - name: synmulti_GPeGPi
    group: fast
    script: dir_indir_pathway_analysis/syn_conn_details.py
    set: {conn_ct: "None", ct2: "6", ct3: "7"}
    published: dir_indir_pathway_analysis/241025_j0251v6_GPe_GPi_syn_multisyn_mcl_200_synprob_0.60_kde1_f20
  # ---- Fig S9: compartment-specific inputs per postsynaptic type
  - name: comp_conn_{CT}
    group: fast
    script: dir_indir_pathway_analysis/CT_comp_conn_analysis.py
    foreach: {CT: [MSN, STN, TAN, GPe, GPi, LTS, INT1, INT2, INT3]}
    set: {post_ct: "{CTID}", cts_for_loading: "np.arange({NCT})"}
    sub: [["2401025_", "241025_"], ["_fs%i_GPi_only", "_fs%i"]]
    published: dir_indir_pathway_analysis/241025_j0251v6_{CT}_input_comps_mcl_200_ax50_synprob_0.60_STNGPINTv6_TeGy_fs20
  # ---- Fig S10, Table S11: recurrence between two types and within GPi
  - name: recurr_STN_GPi
    group: fast
    script: dir_indir_pathway_analysis/recurrent_conn_between2cts.py
    set: {ct1: "4", ct2: "7"}
    sub: [["250520_", "241025_"]]
    published: dir_indir_pathway_analysis/241025_j0251v6_STN_GPi_recurr_conn_mcl_200_synprob_0.60_STNGPINTv6_fs20
  - name: recurr_STN_GPe
    group: fast
    script: dir_indir_pathway_analysis/recurrent_conn_between2cts.py
    set: {ct1: "4", ct2: "6"}
    sub: [["250520_", "241025_"]]
    published: dir_indir_pathway_analysis/241025_j0251v6_STN_GPe_recurr_conn_mcl_200_synprob_0.60_STNGPINTv6_fs20
  - name: recurr_MSN_TAN
    group: fast
    script: dir_indir_pathway_analysis/recurrent_conn_between2cts.py
    set: {ct1: "3", ct2: "5"}
    sub: [["250520_", "241025_"]]
    published: dir_indir_pathway_analysis/241025_j0251v6_MSN_TAN_recurr_conn_mcl_200_synprob_0.60_STNGPINTv6_fs20
  - name: recurr_GPi
    group: fast
    script: dir_indir_pathway_analysis/recurrent_conn_1ct.py
    set: {ct1: "7"}
    published: dir_indir_pathway_analysis/250520_j0251v6_GPi_recurr_conn_mcl_200_synprob_0.60_STNGPINTv6_fs20
  # ---- input / output ratios per population
  - name: inratio_{CT}_LMAN_HVC
    group: fast
    script: dir_indir_pathway_analysis/input_ratio_cell_population.py
    foreach: {CT: [MSN, STN, GPe, GPi, INT1, INT2, INT3]}
    set: {celltype_population: "{CTID}", input_ct_1: "1", input_ct_2: "2", spiness: "None"}
    sub: [["_input_ratio_fs", "_GP_input_ratio_fs"]]
    published: dir_indir_pathway_analysis/250221_j0251v6_{CT}_LMAN_HVC_GP_input_ratio_fs20
  - name: inratio_{CT}_LMAN_HVC_shaft
    group: fast
    script: dir_indir_pathway_analysis/input_ratio_cell_population.py
    foreach: {CT: [MSN, STN, GPe, GPi, INT1, INT2, INT3]}
    set: {celltype_population: "{CTID}", input_ct_1: "1", input_ct_2: "2", spiness: "2"}
    sub: [["_input_ratio_fs", "_GP_input_ratio_fs"]]
    published: "dir_indir_pathway_analysis/250221_j0251v6_{CT}_LMAN_HVC_GP_input_ratio_fs20_sp_dendritic shaft"
  - name: inratio_{CT}_LMAN_HVC_head
    group: fast
