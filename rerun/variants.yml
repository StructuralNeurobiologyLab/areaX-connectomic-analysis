    foreach: {CT: [MSN, STN, GPe, GPi, INT1, INT2, INT3]}
    set: {celltype_population: "{CTID}", input_ct_1: "1", input_ct_2: "2", spiness: "1"}
    sub: [["_input_ratio_fs", "_GP_input_ratio_fs"]]
    published: "dir_indir_pathway_analysis/250221_j0251v6_{CT}_LMAN_HVC_GP_input_ratio_fs20_sp_spine head"
  - name: inratio_STN_GPe_GPi
    group: fast
    script: dir_indir_pathway_analysis/input_ratio_cell_population.py
    set: {celltype_population: "4", input_ct_1: "6", input_ct_2: "7", spiness: "None"}
    sub: [["_input_ratio_fs", "_GP_input_ratio_fs"]]
    published: dir_indir_pathway_analysis/250221_j0251v6_STN_GPe_GPi_GP_input_ratio_fs20
  - name: inratio_STN_GPe_GPi_shaft
    group: fast
    script: dir_indir_pathway_analysis/input_ratio_cell_population.py
    set: {celltype_population: "4", input_ct_1: "6", input_ct_2: "7", spiness: "2"}
    sub: [["_input_ratio_fs", "_GP_input_ratio_fs"]]
    published: "dir_indir_pathway_analysis/250221_j0251v6_STN_GPe_GPi_GP_input_ratio_fs20_sp_dendritic shaft"
  - name: inratio_STN_GPi_GPe
    group: fast
    script: dir_indir_pathway_analysis/input_ratio_cell_population.py
    set: {celltype_population: "4", input_ct_1: "7", input_ct_2: "6", spiness: "None"}
    sub: [["_input_ratio_fs", "_GP_input_ratio_fs"]]
    published: dir_indir_pathway_analysis/250221_j0251v6_STN_GPi_GPe_GP_input_ratio_fs20
  - name: outratio_{CT}_GPi_GPe
    group: fast
    script: dir_indir_pathway_analysis/output_ratio_cell_population.py
    foreach: {CT: [MSN, STN, INT1]}
    set: {celltype_population: "{CTID}", output_ct_1: "7", output_ct_2: "6", spiness: "None"}
    published: dir_indir_pathway_analysis/250221_j0251v6_{CT}_GPi_GPe_output_ratio_fs20
  # ---- Fig 2B/C, S5B: GPe/GPi morphology
  - name: gpe_gpi_params
    group: fast
    script: dir_indir_pathway_analysis/GPe_i_myelin_mito_radius.py
    published: dir_indir_pathway_analysis/241107_j0251v6_GPe_i_myelin_mito_radius_newmerger_mcl200_fs20_med1
  - name: gpe_gpi_pca
    group: fast
    script: dir_indir_pathway_analysis/PCA_UMAP_morph_cts.py
    published: dir_indir_pathway_analysis/241107_j0251v6_GPe_GPi_morph_PCA_20_cell_volume
    note: Fig 2C (PC1 histogram GPe vs GPi); reads GPe_GPi_params.csv of gpe_gpi_params
  # ---- Fig 5B/C, S11C: INT morphology
  - name: int_morph_pca
    group: fast
    script: dir_indir_pathway_analysis/morph_comp_PCA.py
    published: "dir_indir_pathway_analysis/241025_j0251v6_['INT1', 'INT2', 'INT3']_morph_comp_radius_spiness_examplecells_mcl200_fs20_med1_RdTeINTv6_nc1"
  # ---- synapse density per surface, input of ct_morph_analyses
  - name: avg_syn_density
    group: fast
    script: general/avg_synapse_density_per_ct.py
    published: general/250711_j0251v6_avg_syn_den_sb_0.60_mcl_200_TePkBrNGF_newmerger
  # ---- Fig 6 main run and its variants (Fig S2): mcl 50 / ax 0 / mergers in
  - name: fig6_main
    group: fast
    script: general/connectivity_fraction_per_ct.py
    published: general/251023_j0251v6_cts_percentages_mcl_200_ax50_synprob_0.60_TePkBrNGF_newmergers_bw_fs_20_STNnoGP
  - name: fig6_ax0
    group: fast
    script: general/connectivity_fraction_per_ct.py
    set: {min_comp_len_ax: "0"}
    sub: [["251023_j0251{version}_cts_percentages", "250828_j0251{version}_cts_percentages"], ["_bw_fs_%i_STNnoGP", "_bw_fs_%i"]]
    published: general/250828_j0251v6_cts_percentages_mcl_200_ax0_synprob_0.60_TePkBrNGF_newmergers_bw_fs_20
  - name: fig6_mergers_in
    group: fast
    script: general/connectivity_fraction_per_ct.py
    set: {exclude_known_mergers: "False"}
    sub: [["251023_j0251{version}_cts_percentages", "260916_j0251{version}_cts_percentages"], ["_bw_fs_%i_STNnoGP", "_bw_fs_%i_mergers_in"]]
    published: general/260916_j0251v6_cts_percentages_mcl_200_ax50_synprob_0.60_TePkBrNGF_newmergers_bw_fs_20_mergers_in
  # ---- organelle volume densities (inputs of Fig S6 / ct_morph_analyses)
  - name: mi_axon
    group: organelle
    script: general/ct_organell_volume_density.py
    set: {organelle_key: "'mi'", compartment: "1"}
    sub: [["250302_j0251{version}_ct_", "241025_j0251{version}_ct_"]]
    published: general/241025_j0251v6_ct_mi_axon_vol_density_mcl_200_ax200_TePkBrNGF_fs20_nm
  - name: mi_dendrite
    group: organelle
    script: general/ct_organell_volume_density.py
    set: {organelle_key: "'mi'", compartment: "0", full_cells_only: "True"}   # axon classes have no dendrite; with False the celltype column gets NaN and np.unique fails
    sub: [["250302_j0251{version}_ct_", "241025_j0251{version}_ct_"]]
    published: general/241025_j0251v6_ct_mi_dendrite_vol_density_mcl_200_ax200_TePkBrNGF_fs20_nm
  - name: mi_soma
    group: organelle
    script: general/ct_organell_volume_density.py
    set: {organelle_key: "'mi'", compartment: "2", full_cells_only: "True"}
    sub: [["250302_j0251{version}_ct_", "241106_j0251{version}_ct_"]]
    published: general/241106_j0251v6_ct_mi_soma_vol_density_mcl_200_ax200_TePkBrNGF_fs20_nm
  - name: vc_axon
