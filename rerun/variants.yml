  - name: axlen_gt
    group: fast
    script: for_eval/proj_axon_length_comparison.py
    set: {use_gt: "True", filter_syns: "False", gt_path: "f'{bio_params.file_locations}/j0251_celltype_gt_{version}_j0251_72_seg_20210127_agglo2_IDs.csv'"}
